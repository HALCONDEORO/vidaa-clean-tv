name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Stdlib only, no dependencies to install. The suite runs fully offline.
      - name: Run tests
        run: python3 scripts/test_classify_dns_log.py -v
      - name: Validate supplement blocklist
        run: python3 scripts/validate_blocklist.py blocklists/toshiba-uv1553db-supplement.txt
      - name: Check documentation links
        run: python3 scripts/test_docs_links.py -v

  upstream-overlap:
    # The only job that needs the network: it enforces CONTRIBUTING's rule
    # that the supplement never duplicates what the upstream Hisense VIDAA
    # list already covers (an exact domain or one of its subdomains).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Fetch the upstream blocklist
        run: curl -fsSL --retry 3 --retry-delay 5 https://raw.githubusercontent.com/ipanalytics/Hisense-VIDAA-DNS-Clean-TV-Blocklist/main/Blocked_Domains_AdGuard.txt -o "$RUNNER_TEMP/upstream-blocklist.txt"
      - name: Check the supplement adds nothing upstream already covers
        run: python3 scripts/validate_blocklist.py blocklists/toshiba-uv1553db-supplement.txt --upstream "$RUNNER_TEMP/upstream-blocklist.txt"
